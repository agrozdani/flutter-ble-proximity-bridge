name: ble_proximity_bridge
description: >-
  Educational Flutter project demonstrating Flutter <-> native BLE integration
  patterns: MethodChannel commands, EventChannel streaming, a shared binary
  payload format, and RSSI-based distance estimation on Android and iOS.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  permission_handler: ^12.0.3
  device_info_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
